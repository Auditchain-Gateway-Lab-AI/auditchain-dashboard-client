name: Deploy AuditChain Client to Mini PC

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auditchain-client-minipc-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate automatic Mini PC release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image_sha: ${{ steps.release.outputs.image_sha }}

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate deployment inputs
        id: release
        run: |
          set -euo pipefail

          selected_sha="$GITHUB_SHA"
          git rev-parse --verify "${selected_sha}^{commit}" >/dev/null
          for required_path in client-app/Dockerfile client-app/package.json client-app/pnpm-lock.yaml; do
            if ! git cat-file -e "$selected_sha:$required_path" 2>/dev/null; then
              echo "The selected commit does not contain the client build input: $required_path" >&2
              exit 1
            fi
          done

          echo "image_sha=$selected_sha" >> "$GITHUB_OUTPUT"
          echo "Validated automatic Mini PC deployment for source commit $selected_sha."

  ci:
    name: Run client CI before deployment
    uses: ./.github/workflows/client-ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish image digest
    needs: [validate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_name: ${{ steps.config.outputs.image_name }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.image_sha }}

      - name: Validate deployment variables before publishing
        id: config
        env:
          MINIPC_TAILSCALE_IP: ${{ vars.MINIPC_TAILSCALE_IP }}
          MINIPC_CLIENT_PORT: ${{ vars.MINIPC_CLIENT_PORT }}
          MINIPC_CLIENT_URL: ${{ vars.MINIPC_CLIENT_URL }}
          MINIPC_GATEWAY_API_URL: ${{ vars.MINIPC_GATEWAY_API_URL }}
          MINIPC_LEGACY_COMPOSE_DIR: ${{ vars.MINIPC_LEGACY_COMPOSE_DIR }}
          BESU_ADMIN_PORTAL_URL: ${{ vars.BESU_ADMIN_PORTAL_URL }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CLIENT_CONTAINER_PORT: ${{ vars.CLIENT_CONTAINER_PORT }}
          MINIPC_SSH_USERNAME: ${{ vars.MINIPC_SSH_USERNAME }}
          MINIPC_SSH_PORT: ${{ vars.MINIPC_SSH_PORT }}
        run: |
          set -euo pipefail
          bash client-app/scripts/validate-deployment-config.sh deploy
          image_name="${CONTAINER_REGISTRY}/${GITHUB_REPOSITORY,,}-client"
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to configured container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish client image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: client-app
          file: client-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.config.outputs.image_name }}:${{ needs.validate.outputs.image_sha }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_GATEWAY_PORTAL_URL=${{ vars.BESU_ADMIN_PORTAL_URL }}
            CLIENT_CONTAINER_PORT=${{ vars.CLIENT_CONTAINER_PORT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.image_sha }}

  deploy:
    name: Deploy to Mini PC
    needs: [validate, publish]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: development
      url: ${{ vars.MINIPC_CLIENT_URL }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v7

      - name: Validate required variables and secrets before remote access
        env:
          MINIPC_TAILSCALE_IP: ${{ vars.MINIPC_TAILSCALE_IP }}
          MINIPC_CLIENT_PORT: ${{ vars.MINIPC_CLIENT_PORT }}
          MINIPC_CLIENT_URL: ${{ vars.MINIPC_CLIENT_URL }}
          MINIPC_GATEWAY_API_URL: ${{ vars.MINIPC_GATEWAY_API_URL }}
          MINIPC_LEGACY_COMPOSE_DIR: ${{ vars.MINIPC_LEGACY_COMPOSE_DIR }}
          BESU_ADMIN_PORTAL_URL: ${{ vars.BESU_ADMIN_PORTAL_URL }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CLIENT_CONTAINER_PORT: ${{ vars.CLIENT_CONTAINER_PORT }}
          MINIPC_SSH_USERNAME: ${{ vars.MINIPC_SSH_USERNAME }}
          MINIPC_SSH_PORT: ${{ vars.MINIPC_SSH_PORT }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          MINIPC_SSH_PASSWORD: ${{ secrets.MINIPC_SSH_PASSWORD }}
          MINIPC_SSH_HOST_FINGERPRINT: ${{ secrets.MINIPC_SSH_HOST_FINGERPRINT }}
          REGISTRY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          bash client-app/scripts/validate-deployment-config.sh deploy
          for name in TS_AUTHKEY MINIPC_SSH_PASSWORD MINIPC_SSH_HOST_FINGERPRINT REGISTRY_READ_TOKEN REGISTRY_USERNAME; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required development environment secret or identity: $name" >&2
              exit 1
            fi
          done

      - name: Connect runner to the Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ vars.MINIPC_TAILSCALE_IP }}

      - name: Package deployment files
        env:
          BUNDLE_NAME: client-deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
        run: |
          set -euo pipefail
          tar -czf "$BUNDLE_NAME" \
            -C "$GITHUB_WORKSPACE/client-app/deploy" compose-minipc.yaml \
            -C "$GITHUB_WORKSPACE/client-app/scripts" deploy-to-minipc.sh

      - name: Copy release configuration to Mini PC
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.MINIPC_TAILSCALE_IP }}
          username: ${{ vars.MINIPC_SSH_USERNAME }}
          port: ${{ vars.MINIPC_SSH_PORT }}
          password: ${{ secrets.MINIPC_SSH_PASSWORD }}
          fingerprint: ${{ secrets.MINIPC_SSH_HOST_FINGERPRINT }}
          source: client-deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          target: /tmp/
          timeout: 60s
          command_timeout: 2m

      - name: Deploy and verify dashboard on Mini PC
        uses: appleboy/ssh-action@v1
        env:
          BUNDLE_NAME: client-deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          REGISTRY_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          MINIPC_TAILSCALE_IP: ${{ vars.MINIPC_TAILSCALE_IP }}
          MINIPC_CLIENT_PORT: ${{ vars.MINIPC_CLIENT_PORT }}
          MINIPC_CLIENT_URL: ${{ vars.MINIPC_CLIENT_URL }}
          MINIPC_GATEWAY_API_URL: ${{ vars.MINIPC_GATEWAY_API_URL }}
          MINIPC_LEGACY_COMPOSE_DIR: ${{ vars.MINIPC_LEGACY_COMPOSE_DIR }}
          BESU_ADMIN_PORTAL_URL: ${{ vars.BESU_ADMIN_PORTAL_URL }}
          CLIENT_CONTAINER_PORT: ${{ vars.CLIENT_CONTAINER_PORT }}
          CLIENT_IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          CLIENT_IMAGE_SHA: ${{ needs.validate.outputs.image_sha }}
          CLIENT_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
          CLIENT_IMAGE_REF: ${{ needs.publish.outputs.image_name }}@${{ needs.publish.outputs.image_digest }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ vars.MINIPC_TAILSCALE_IP }}
          username: ${{ vars.MINIPC_SSH_USERNAME }}
          port: ${{ vars.MINIPC_SSH_PORT }}
          password: ${{ secrets.MINIPC_SSH_PASSWORD }}
          fingerprint: ${{ secrets.MINIPC_SSH_HOST_FINGERPRINT }}
          envs: BUNDLE_NAME,REGISTRY_READ_TOKEN,REGISTRY_USERNAME,CONTAINER_REGISTRY,MINIPC_TAILSCALE_IP,MINIPC_CLIENT_PORT,MINIPC_CLIENT_URL,MINIPC_GATEWAY_API_URL,MINIPC_LEGACY_COMPOSE_DIR,BESU_ADMIN_PORTAL_URL,CLIENT_CONTAINER_PORT,CLIENT_IMAGE_NAME,CLIENT_IMAGE_SHA,CLIENT_IMAGE_DIGEST,CLIENT_IMAGE_REF,GITHUB_RUN_ID
          command_timeout: 15m
          script: |
            set -eu
            case "$GITHUB_RUN_ID" in ''|*[!0-9]*) echo "Invalid workflow run ID." >&2; exit 1 ;; esac
            case "$BUNDLE_NAME" in "client-deploy-${GITHUB_RUN_ID}-"*.tar.gz) ;; *) echo "Unexpected deployment bundle name." >&2; exit 1 ;; esac

            bundle_path="/tmp/$BUNDLE_NAME"
            package_dir="$(mktemp -d "/tmp/auditchain-client-${GITHUB_RUN_ID}.XXXXXX")"
            cleanup() {
              rm -rf -- "$package_dir"
              rm -f -- "$bundle_path"
            }
            trap cleanup 0
            tar -xzf "$bundle_path" -C "$package_dir"

            export DEPLOY_PACKAGE_DIR="$package_dir"
            export DASHBOARD_PROJECT_DIR="${HOME}/auditchain/client-portal"
            export MINIPC_TAILSCALE_IP MINIPC_CLIENT_PORT MINIPC_CLIENT_URL MINIPC_GATEWAY_API_URL MINIPC_LEGACY_COMPOSE_DIR
            export BESU_ADMIN_PORTAL_URL CLIENT_CONTAINER_PORT CONTAINER_REGISTRY
            export CLIENT_IMAGE_NAME CLIENT_IMAGE_SHA CLIENT_IMAGE_DIGEST CLIENT_IMAGE_REF
            export REGISTRY_USERNAME REGISTRY_READ_TOKEN GITHUB_RUN_ID
            bash "$package_dir/deploy-to-minipc.sh"

      - name: Record deployed release
        env:
          MINIPC_CLIENT_URL: ${{ vars.MINIPC_CLIENT_URL }}
          CLIENT_IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          CLIENT_IMAGE_SHA: ${{ needs.validate.outputs.image_sha }}
          CLIENT_IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          {
            echo "### AuditChain Client Mini PC deployment"
            echo
            echo "- Result: successful; the remote script passed dashboard health and Gateway API connectivity checks."
            echo "- Image: \`$CLIENT_IMAGE_NAME@$CLIENT_IMAGE_DIGEST\` (source commit \`$CLIENT_IMAGE_SHA\`)"
            echo "- Dashboard: $MINIPC_CLIENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local deployment bundle
        if: ${{ always() }}
        env:
          BUNDLE_NAME: client-deploy-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
        run: rm -f -- "$BUNDLE_NAME"
